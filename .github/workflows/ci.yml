name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: "1.95.0" # = nixpkgs nixos-26.05 rustc
  GO_VERSION: "1.26.5" # = tools/vectorgen/go.mod and dstore v0.1.9's go.mod
  DSTORE_GO_REF: v0.1.9

jobs:
  rust:
    name: rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: cargo fmt
        run: cargo fmt --all --check
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: cargo test (unit, golden vectors, CLI snapshots and actions, fake cluster, iroh loopback)
        run: cargo test --workspace --all-targets --locked --no-fail-fast
        env:
          TZ: UTC

  vectors:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/vectorgen
    env:
      GOTOOLCHAIN: local
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: tools/vectorgen/go.sum
      - name: go vet
        run: go vet ./...
      - name: go test (registry rules, clisnap cases and fixture steps, copied cmd/dstore tests)
        run: go test ./...
      - name: Regenerate every family twice; deterministic and equal to tests/golden
        run: |
          go run . "$RUNNER_TEMP/golden-a"
          go run . "$RUNNER_TEMP/golden-b"
          diff -r "$RUNNER_TEMP/golden-a" "$RUNNER_TEMP/golden-b"
          diff -r --exclude=snapshots.json --exclude=.gitkeep "$RUNNER_TEMP/golden-a" ../../tests/golden
      - name: Regenerate crates/gocompat/src/tables.rs
        run: |
          go run ./cmd/gotables > "$RUNNER_TEMP/tables.rs"
          diff -u ../../crates/gocompat/src/tables.rs "$RUNNER_TEMP/tables.rs"
      - name: Regenerate crates/gocompat/src/errno_tables.rs
        run: |
          go run ./cmd/goerrno > "$RUNNER_TEMP/errno_tables.rs"
          diff -u ../../crates/gocompat/src/errno_tables.rs "$RUNNER_TEMP/errno_tables.rs"
      - name: Regenerate tests/golden/cli/snapshots.json (Go binary built into a temporary directory and removed)
        run: |
          go run ./cmd/clisnap -o "$RUNNER_TEMP/cli"
          diff -u ../../tests/golden/cli/snapshots.json "$RUNNER_TEMP/cli/snapshots.json"

  interop:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: dstore-client-rs
    steps:
      # This repository and Go dstore side by side: $GITHUB_WORKSPACE/dstore-client-rs and $GITHUB_WORKSPACE/dstore.
      - uses: actions/checkout@v4
        with:
          path: dstore-client-rs
      - uses: actions/checkout@v4
        with:
          repository: amber-store/dstore
          ref: ${{ env.DSTORE_GO_REF }}
          path: dstore
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: dstore-client-rs
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: |
            dstore/go.sum
            dstore-client-rs/tools/vectorgen/go.sum
      - name: Build the Rust CLI and examples
        run: cargo build --release --locked --bin dstore --examples
      - name: Raise the UDP buffer limits (quic-go and noq ask for 7 MiB)
        run: sudo sysctl -w net.core.rmem_max=7500000 net.core.wmem_max=7500000
      - name: Live Go <-> Rust interop over a 3-node loopback cluster
        run: bash interop/check.sh
        env:
          GOTOOLCHAIN: local
          CGO_ENABLED: "0"
          DSTORE_GO_REPO: ${{ github.workspace }}/dstore
          DSTORE_RS_BIN: ${{ github.workspace }}/dstore-client-rs/target/release/dstore
          INTEROP_MDNS: auto
          INTEROP_LOG_DIR: ${{ runner.temp }}/interop-logs
          # the heavy (transitions) and chaos (node restarts) groups only on manual runs
          INTEROP_HEAVY: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
          INTEROP_CHAOS: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: interop-logs
          path: ${{ runner.temp }}/interop-logs
          if-no-files-found: ignore

  nix:
    name: nix (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: nix flake check
        run: nix flake check -L
      - name: nix build
        run: nix build .#dstore -L && ./result/bin/dstore --version
